# require: approval holds the call for a human (blocked until M9).
version: 1
mode: observe
defaults: deny
rules:
  - id: gh-push-needs-approval
    allow: github.push_files
    require: approval
  - id: gh-pr-needs-approval
    allow: github.create_pull_request
    require: approval
    when: { session: { saw_untrusted: false } }
