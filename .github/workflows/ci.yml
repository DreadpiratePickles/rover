# CI for Rover. `make ci` runs the same checks locally; keep the two in sync.
#
# Supply-chain notes:
# - Every third-party action is pinned to a full commit SHA (a tag can be
#   moved to point at different code; a SHA cannot). The comment names the tag.
# - The workflow token is read-only, and checkout does not leave it on disk.
# - Tool versions are pinned: golangci-lint v2.5.0, govulncheck v1.7.0, and Go
#   from the `toolchain` line in go.mod.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # Same command as `make fuzz`. It exits non-zero only when the fuzzer
      # finds an input that crashes the parser; no new coverage is not a failure.
      - name: fuzz jsonrpc.Parse (30s)
        run: go test ./internal/jsonrpc -run='^$' -fuzz=FuzzParse -fuzztime=30s
      - name: fuzz ipc.Parse (30s)
        run: go test ./internal/ipc -run='^$' -fuzz=FuzzParse -fuzztime=30s
      - name: fuzz audit.Verify (30s)
        run: go test ./internal/audit -run='^$' -fuzz=FuzzVerify -fuzztime=30s
      - name: fuzz framing.ReadLine (30s)
        run: go test ./internal/framing -run='^$' -fuzz=FuzzReadLine -fuzztime=30s
      # On a crash, keep the failing input so it can be reproduced locally
      # (copy it into internal/jsonrpc/testdata/fuzz/FuzzParse/ and run go test).
      - name: upload crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            internal/jsonrpc/testdata/fuzz/
            internal/ipc/testdata/fuzz/
            internal/audit/testdata/fuzz/
            internal/framing/testdata/fuzz/
          if-no-files-found: ignore

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # Same version as `make tools`. setup-go puts $(go env GOPATH)/bin on PATH.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: govulncheck ./...
