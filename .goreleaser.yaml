# GoReleaser configuration (plan M7, release v0.1.0).
# `make snapshot` runs `goreleaser release --snapshot --clean`: it builds
# into dist/ and publishes nothing. Tagging and publishing are Bobby's.
version: 2

project_name: rover

before:
  hooks:
    - go mod verify

builds:
  - id: rover
    main: ./cmd/rover
    binary: rover
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: rover
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true
